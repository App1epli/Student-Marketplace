services:
  db:
    image: postgres:16-alpine
    container_name: student-marketplace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-student_marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
    ports:
      - "5432:5432"
    volumes:
      - student_marketplace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace} -d ${POSTGRES_DB:-student_marketplace}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  student_marketplace_pgdata:
