{% extends "base.html" %}
{% block content %}
<section class="panel auth-panel" style="max-width:520px">
  <h2>{{ _("Log in") }}</h2>
  {% if notice %}<p class="subtle" role="status">{{ _(notice) }}</p>{% endif %}
  {% if error %}<p class="checkout-error" role="alert">{{ _(error) }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">{{ _("Email") }}</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">{{ _("Password") }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <div class="form-actions"><button type="submit">{{ _("Log in") }}</button></div>
  </form>
  <p class="subtle">{{ _("No account?") }} <a href="{{ url_for('auth.register') }}">{{ _("Create one") }}</a>{{ _(". The catalog stays public; messaging requires an account.") }}</p>
</section>
{% endblock %}
