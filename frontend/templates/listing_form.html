<section class="panel form-panel"><h2>List an item</h2>
<p class="form-intro">Add a few details so other students can find it.</p>
<form method="post" action="/listing"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid">
<div class="wide"><label for="seller">Seller</label><select id="seller" name="seller_id" required><option value="">Select a seller</option>{% for p in people %}<option value="{{ p.student_id }}">{{ p.full_name }}</option>{% endfor %}</select></div>
<div class="wide"><label for="category">Category</label><select id="category" name="category_id" required><option value="">Select a category</option>{% for c in categories %}<option value="{{ c.category_id }}">{{ c.category_name }}</option>{% endfor %}</select></div>
<div class="wide"><label for="name">Item name</label><input id="name" name="product_name" maxlength="120" placeholder="For example, programming textbook" required></div>
<div class="wide"><label for="description">Description</label><textarea id="description" name="description" placeholder="Condition, included accessories, and other details" required></textarea></div>
<div><label for="price">Price, ₸</label><input id="price" name="price" type="number" min="1" max="99999999.99" step="0.01" placeholder="3500" required></div>
<div><label for="condition">Condition</label><select id="condition" name="item_condition">{% for value in conditions %}<option value="{{ value }}">{{ value }}</option>{% endfor %}</select></div>
</div><div class="form-actions"><button type="submit">Publish listing</button></div>
<p class="safe-note">Set a fair price and describe the item's condition. Your listing will appear in the catalog.</p></form></section>
