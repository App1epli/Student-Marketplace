
{% extends "base.html" %}

{% block content %}
<section class="panel form-panel">
  <h2>Edit Listing</h2>

  <form method="post"
        action="{{ url_for('update_listing', product_id=product.product_id) }}">

    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <label for="name">Product Name</label>
    <input id="name"
           name="product_name"
           value="{{ product.product_name }}"
           maxlength="120"
           required>

    <label for="description">Description</label>
    <textarea id="description"
              name="description"
              required>{{ product.description }}</textarea>

    <label for="category">Category</label>
    <select id="category" name="category_id" required>
      {% for c in categories %}
      <option value="{{ c.category_id }}"
        {% if c.category_id == product.category_id %}selected{% endif %}>
        {{ c.category_name }}
      </option>
      {% endfor %}
    </select>

    <label for="price">Price (₸)</label>
    <input id="price"
           name="price"
           type="number"
           step="0.01"
           min="0.01"
           max="99999999.99"
           value="{{ product.price }}"
           required>

    <label for="condition">Condition</label>
    <select id="condition" name="item_condition">
      {% for c in conditions %}
      <option value="{{ c }}"
        {% if c == product.item_condition %}selected{% endif %}>
        {{ c }}
      </option>
      {% endfor %}
    </select>

    <div class="form-actions">
      <button type="submit">Save Changes</button>
      <a class="button" href="{{ url_for('my_listings') }}">
        Cancel
      </a>
    </div>
  </form>
</section>
{% endblock %}
