{% extends 'base.html' %}
{% block content %}
<div class="selling-page"><a class="back-link" href="{{ url_for('my_listings') }}">{{ _('Back to My listings') }}</a><section class="panel form-panel"><h1>{{ _('Edit Listing') }}</h1><form method="post" action="{{ url_for('update_listing', product_id=product.product_id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid">
<div class="wide"><label for="category">{{ _('Category') }}</label><select id="category" name="category_id" required>{% for c in categories %}<option value="{{ c.category_id }}" {% if c.category_id == product.category_id %}selected{% endif %}>{{ _(c.category_name) }}</option>{% endfor %}</select></div>
<div class="wide"><label for="name">{{ _('Item name') }}</label><input id="name" name="product_name" value="{{ product.product_name }}" maxlength="120" required></div>
<div class="wide"><label for="description">{{ _('Description') }}</label><textarea id="description" name="description" required>{{ product.description }}</textarea></div>
<div><label for="price">{{ _('Price, ₸') }}</label><input id="price" name="price" type="number" min="0.01" max="99999999.99" step="0.01" value="{{ product.price }}" required></div>
<div><label for="condition">{{ _('Condition') }}</label><select id="condition" name="item_condition">{% for value in conditions %}<option value="{{ value }}" {% if value == product.item_condition %}selected{% endif %}>{{ _(value) }}</option>{% endfor %}</select></div>
</div><div class="form-actions"><button type="submit">{{ _('Save changes') }}</button></div></form></section></div>
{% endblock %}
